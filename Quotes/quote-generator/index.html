<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0e12;
      --card: #1a1820;
      --accent: #c9a227;
      --text: #e8e4e0;
      --muted: #8a8580;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201, 162, 39, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(201, 162, 39, 0.06), transparent);
    }

    .quote-box {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(201, 162, 39, 0.2);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
    }

    .quote-mark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      line-height: 1;
      color: var(--accent);
      opacity: 0.5;
      margin-bottom: -1rem;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      min-height: 4.5em;
    }

    .quote-text.fade {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quote-author {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
      padding-left: 1rem;
      border-left: 3px solid var(--accent);
    }

    .btn {
      margin-top: 2rem;
      padding: 0.85rem 1.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn:hover {
      background: #d4b02d;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="quote-box">
    <div class="quote-mark">"</div>
    <p class="quote-text" id="quote">Click the button below for a random quote.</p>
    <p class="quote-author" id="author"></p>
    <button class="btn" id="new-quote">New quote</button>
  </div>

  <script>
    const quotes = [
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
      { text: "It is during our darkest moments that we must focus to see the light.", author: "Aristotle" },
      { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
      { text: "In the end, we will remember not the words of our enemies, but the silence of our friends.", author: "Martin Luther King Jr." },
      { text: "The only impossible journey is the one you never begin.", author: "Tony Robbins" },
      { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
      { text: "Life is what happens when you're busy making other plans.", author: "John Lennon" },
      { text: "The best time to plant a tree was 20 years ago. The second best time is now.", author: "Chinese Proverb" },
      { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
      { text: "Be the change that you wish to see in the world.", author: "Mahatma Gandhi" },
      { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Aristotle" },
      { text: "The only thing we have to fear is fear itself.", author: "Franklin D. Roosevelt" },
      { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
      { text: "Everything you've ever wanted is on the other side of fear.", author: "George Addair" },
      { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" }
    ];

    const quoteEl = document.getElementById('quote');
    const authorEl = document.getElementById('author');
    const btn = document.getElementById('new-quote');

    function getRandomQuote() {
      const i = Math.floor(Math.random() * quotes.length);
      return quotes[i];
    }

    function showQuote() {
      quoteEl.classList.remove('fade');
      const { text, author } = getRandomQuote();
      quoteEl.textContent = text;
      authorEl.textContent = author;
      quoteEl.offsetHeight;
      quoteEl.classList.add('fade');
    }

    btn.addEventListener('click', showQuote);
    showQuote();
  </script>
</body>
</html>
